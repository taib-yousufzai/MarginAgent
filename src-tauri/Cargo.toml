[package]
name = "marginagent"
version = "0.1.0"
description = "MarginAgent — local-first AI coding workspace"
authors = ["you"]
edition = "2021"

[package.metadata.bundle]
identifier = "dev.marginagent.app"
icon = ["icons/icon.ico"]

[lib]
name = "marginagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "marginagent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
git2 = "0.20"
walkdir = "2"
ignore = "0.4"
futures-util = "0.3"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
